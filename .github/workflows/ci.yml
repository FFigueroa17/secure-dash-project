name: CI Pipeline - Secure Dash Client

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop, feature/**]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Stage 1 - Code Quality Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: secure-dash-client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --prefer-offline --legacy-peer-deps
        env:
          HUSKY: 0

      - name: Run Linter
        run: npm run lint

      - name: Run Type-check
        run: npm run typecheck

      - name: Run Prettier Check
        run: npm run format:check

  build:
    name: Stage 2 - Container Build
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: secure-dash-client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --prefer-offline --legacy-peer-deps
        env:
          HUSKY: 0

      - name: Build
        run: npm run build

  integration-tests:
    name: Stage 3 - Integration & Flow Test
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: secure-dash-client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --prefer-offline --legacy-peer-deps
        env:
          HUSKY: 0

      - name: Run Integration Tests
        run: npm run test:integration

  unit-tests:
    name: Stage 4 - Unit Tests
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: secure-dash-client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --prefer-offline --legacy-peer-deps
        env:
          HUSKY: 0

      - name: Run Unit Tests with Coverage
        run: npm run test:ci

      - name: Upload Coverage Reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          working-directory: secure-dash-client
          files: ./coverage/lcov.info,./coverage/clover.xml,./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true

      - name: Upload Coverage Reports as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: secure-dash-client/coverage/
          retention-days: 30

  coverage-report:
    name: Stage 4.5 - Coverage Report
    needs: unit-tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      contents: read
    defaults:
      run:
        working-directory: secure-dash-client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Coverage Reports
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports
          path: secure-dash-client/coverage/

      - name: Coverage Comment
        uses: romeovs/lcov-reporter-action@v0.3.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          lcov-file: secure-dash-client/coverage/lcov.info
          delete-old-comments: true

  notify-github:
    name: Stage 5 - Smart GitHub Issue Management
    needs: [lint, build, unit-tests, integration-tests]
    runs-on: ubuntu-latest
    if: |
      always() && (
        needs.lint.result == 'failure' ||
        needs.build.result == 'failure' ||
        needs.integration-tests.result == 'failure' ||
        needs.unit-tests.result == 'failure'
      )
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute pipeline status
        id: compute_status
        run: |
          if [ "${{ needs.lint.result }}" == "success" ]       &&
             [ "${{ needs.build.result }}" == "success" ]      &&
             [ "${{ needs.integration-tests.result }}" == "success" ] &&
             [ "${{ needs.unit-tests.result }}" == "success" ]; then
            echo "status=✅ SUCCESS" >> "$GITHUB_OUTPUT"
          else
            echo "status=❌ FAILED"  >> "$GITHUB_OUTPUT"
          fi

      - name: Search for existing CI pipeline issues
        id: search_issues
        run: |
          # Create a unique identifier for this branch/workflow combination
          BRANCH_NAME="${{ github.ref_name }}"
          WORKFLOW_NAME="${{ github.workflow }}"

          # Clean branch name for search (replace special chars with dashes)
          CLEAN_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9]/-/g')

          # Create unique identifier
          UNIQUE_ID="[CI-${CLEAN_BRANCH}-${WORKFLOW_NAME}]"

          echo "Searching for existing issues with identifier: $UNIQUE_ID"

          # Search for open issues with our unique identifier in the title
          SEARCH_QUERY="repo:${{ github.repository }} is:issue is:open \"$UNIQUE_ID\" in:title"

          echo "Search query: $SEARCH_QUERY"

          RESPONSE=$(curl -s -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/search/issues?q=$(echo "$SEARCH_QUERY" | sed 's/ /%20/g' | sed 's/"/%22/g')")

          echo "API Response: $RESPONSE"

          ISSUE_COUNT=$(echo "$RESPONSE" | jq -r '.total_count // 0')
          echo "Found $ISSUE_COUNT existing issues"

          if [ "$ISSUE_COUNT" -gt 0 ]; then
            ISSUE_NUMBER=$(echo "$RESPONSE" | jq -r '.items[0].number')
            ISSUE_URL=$(echo "$RESPONSE" | jq -r '.items[0].html_url')
            echo "existing_issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
            echo "existing_issue_url=$ISSUE_URL" >> "$GITHUB_OUTPUT"
            echo "has_existing_issue=true" >> "$GITHUB_OUTPUT"
            echo "Found existing issue #$ISSUE_NUMBER: $ISSUE_URL"
          else
            echo "has_existing_issue=false" >> "$GITHUB_OUTPUT"
            echo "No existing issues found, will create new one"
          fi

          # Store the unique identifier for later use
          echo "unique_id=$UNIQUE_ID" >> "$GITHUB_OUTPUT"

      - name: Render Issue template
        id: render_issue
        shell: bash
        run: |
          TEMPLATE='.github/ISSUE_TEMPLATES/ci-pipeline-template.md'
          OUT='issue-body.md'

          export STATUS='${{ steps.compute_status.outputs.status }}'
          export WORKFLOW='${{ github.workflow }}'
          export REF_NAME='${{ github.ref_name }}'
          export EVENT_NAME='${{ github.event_name }}'
          export SHA='${{ github.sha }}'
          export SHORT_SHA='${{ github.sha }}' ; SHORT_SHA=${SHORT_SHA:0:7} ; export SHORT_SHA
          export ACTOR='${{ github.actor }}'
          export RUN_URL='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          export REPO='${{ github.repository }}'

          export LINT_STATUS='${{ needs.lint.result }}'
          export BUILD_STATUS='${{ needs.build.result }}'
          export INTEGRATION_STATUS='${{ needs.integration-tests.result }}'
          export UNIT_STATUS='${{ needs.unit-tests.result }}'

          perl -pe 's/\{\{(\w+)\}\}/$ENV{$1}/ge' "$TEMPLATE" > "$OUT"

      - name: Create comment template for existing issue
        if: steps.search_issues.outputs.has_existing_issue == 'true'
        id: render_comment
        shell: bash
        run: |
          COMMENT_TEMPLATE='.github/ISSUE_TEMPLATES/ci-pipeline-comment-template.md'
          OUT='comment-body.md'

          export STATUS='${{ steps.compute_status.outputs.status }}'
          export WORKFLOW='${{ github.workflow }}'
          export REF_NAME='${{ github.ref_name }}'
          export EVENT_NAME='${{ github.event_name }}'
          export SHA='${{ github.sha }}'
          export SHORT_SHA='${{ github.sha }}' ; SHORT_SHA=${SHORT_SHA:0:7} ; export SHORT_SHA
          export ACTOR='${{ github.actor }}'
          export RUN_URL='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          export REPO='${{ github.repository }}'
          export TIMESTAMP="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          export LINT_STATUS='${{ needs.lint.result }}'
          export BUILD_STATUS='${{ needs.build.result }}'
          export INTEGRATION_STATUS='${{ needs.integration-tests.result }}'
          export UNIT_STATUS='${{ needs.unit-tests.result }}'

          # Create a simplified version since we can't use complex templating
          cat > "$OUT" << EOF
          ## 🔄 Pipeline Update - ${SHORT_SHA}

          **New Failure Detected:** ${STATUS}  
          **Commit:** [\`${SHORT_SHA}\`](https://github.com/${REPO}/commit/${SHA})  
          **Workflow Run:** [View Details](${RUN_URL})  
          **Triggered by:** @${ACTOR}  
          **Time:** ${TIMESTAMP}

          ### 📊 Current Pipeline Status

          | **Stage**   | **Job Name**       | **Status**               | **Description**                                        |
          | ----------- | ------------------ | ------------------------ | ------------------------------------------------------ |
          | **Stage 1** | Code Quality Check | \`${LINT_STATUS}\`        | ESLint, TypeScript validation, and Prettier formatting |
          | **Stage 2** | Container Build    | \`${BUILD_STATUS}\`       | Next.js application build process                      |
          | **Stage 3** | Integration Tests  | \`${INTEGRATION_STATUS}\` | End-to-end and integration test suite                  |
          | **Stage 4** | Unit Tests         | \`${UNIT_STATUS}\`        | Component and utility function unit tests              |

          ### 🔗 Quick Actions
          - [View Workflow Run](${RUN_URL})
          - [View Commit](https://github.com/${REPO}/commit/${SHA})
          - [View Branch](https://github.com/${REPO}/tree/${REF_NAME})

          ---
          _This comment was automatically generated by the CI/CD pipeline. Issue will be automatically closed when all stages pass._
          EOF

      - name: Comment on existing issue
        if: steps.search_issues.outputs.has_existing_issue == 'true'
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/issues/${{ steps.search_issues.outputs.existing_issue_number }}/comments" \
            -d @- << 'EOF'
          {
            "body": "$(cat comment-body.md | jq -Rs .)"
          }
          EOF

          echo "✅ Added comment to existing issue #${{ steps.search_issues.outputs.existing_issue_number }}"
          echo "🔗 Issue URL: ${{ steps.search_issues.outputs.existing_issue_url }}"

      - name: Create new issue
        if: steps.search_issues.outputs.has_existing_issue == 'false'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: |
            ${{ steps.search_issues.outputs.unique_id }} CI Pipeline ${{ steps.compute_status.outputs.status }} - ${{ github.workflow }} on ${{ github.ref_name }}
          content-filepath: issue-body.md
          assignees: ${{ github.actor }}
          labels: |
            ci-pipeline,
            secure-dash-client

  close-resolved-issues:
    name: Stage 6 - Close Resolved Issues
    needs: [lint, build, unit-tests, integration-tests]
    runs-on: ubuntu-latest
    if: |
      always() && (
        needs.lint.result == 'success' &&
        needs.build.result == 'success' &&
        needs.integration-tests.result == 'success' &&
        needs.unit-tests.result == 'success'
      )
    permissions:
      issues: write
      contents: read
    steps:
      - name: Search and close resolved CI pipeline issues
        run: |
          # Create the same unique identifier used in issue creation
          BRANCH_NAME="${{ github.ref_name }}"
          WORKFLOW_NAME="${{ github.workflow }}"

          # Clean branch name for search (replace special chars with dashes)
          CLEAN_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9]/-/g')

          # Create unique identifier
          UNIQUE_ID="[CI-${CLEAN_BRANCH}-${WORKFLOW_NAME}]"

          echo "Searching for resolved issues with identifier: $UNIQUE_ID"

          # Search for open issues with our unique identifier in the title
          SEARCH_QUERY="repo:${{ github.repository }} is:issue is:open \"$UNIQUE_ID\" in:title"

          echo "Search query: $SEARCH_QUERY"

          RESPONSE=$(curl -s -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/search/issues?q=$(echo "$SEARCH_QUERY" | sed 's/ /%20/g' | sed 's/"/%22/g')")

          ISSUE_COUNT=$(echo "$RESPONSE" | jq -r '.total_count // 0')
          echo "Found $ISSUE_COUNT issues to potentially close"

          if [ "$ISSUE_COUNT" -gt 0 ]; then
            echo "$RESPONSE" | jq -r '.items[].number' | while read -r ISSUE_NUMBER; do
              echo "Closing issue #$ISSUE_NUMBER as pipeline is now successful"
              
              # Add success comment
              curl -X POST \
                -H "Authorization: Bearer ${{ github.token }}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${{ github.api_url }}/repos/${{ github.repository }}/issues/$ISSUE_NUMBER/comments" \
                -d @- << 'EOF'
              {
                "body": "## ✅ Pipeline Resolved!\n\n**Status:** All stages now passing  \n**Commit:** [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})  \n**Workflow Run:** [View Details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})  \n**Resolved by:** @${{ github.actor }}  \n**Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')\n\nClosing this issue as the CI pipeline is now successful. 🎉\n\n---\n_This comment was automatically generated by the CI/CD pipeline._"
              }
          EOF
              
              # Close the issue
              curl -X PATCH \
                -H "Authorization: Bearer ${{ github.token }}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${{ github.api_url }}/repos/${{ github.repository }}/issues/$ISSUE_NUMBER" \
                -d '{"state": "closed", "state_reason": "completed"}'
              
              echo "✅ Closed issue #$ISSUE_NUMBER"
            done
          else
            echo "No issues found to close"
          fi
